<div class="stars" role="radiogroup" aria-label="Rating">
  @for (star of stars(); track star) {
    <button
      type="button"
      class="star"
      [class.filled]="star <= value()"
      role="radio"
      [attr.aria-checked]="star === value()"
      [attr.aria-label]="star + (star === 1 ? ' star' : ' stars')"
      [disabled]="readonly()"
      (click)="select(star)"
    >
      ★
    </button>
  }
</div>
